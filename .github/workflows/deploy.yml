# Deploy desactivado — producción en Vercel (dynastymarketinga-com.vercel.app).
# El dominio www.dynastymarketinga.com apunta a Vercel, no a GitHub Pages.
#
# Para reactivar GitHub Pages, descomenta el bloque `on:` inferior.

name: Deploy to GitHub Pages (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Use Vercel for production deploys"

